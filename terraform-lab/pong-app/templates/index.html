<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0f0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #39ff14;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 0, 0.03) 2px,
        rgba(0, 255, 0, 0.03) 4px
      );
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
      letter-spacing: 6px;
      text-shadow: 0 0 8px #39ff14, 0 0 20px #00cc00;
    }

    #scoreboard {
      display: flex;
      gap: 80px;
      font-size: 1.5rem;
      margin-bottom: 14px;
      text-shadow: 0 0 6px #39ff14;
    }

    /* Outer bezel — gives the table-top cabinet feel */
    #bezel {
      padding: 18px 22px 14px;
      background: radial-gradient(ellipse at center, #1a2e1a 0%, #0d1a0d 100%);
      border: 3px solid #2a5a2a;
      border-radius: 12px;
      box-shadow:
        0 0 0 1px #0a0f0a,
        0 0 18px rgba(57,255,20,0.25),
        inset 0 0 30px rgba(0,0,0,0.6);
    }

    canvas {
      display: block;
      border: 2px solid #39ff14;
      border-radius: 4px;
      box-shadow:
        0 0 10px #39ff14,
        0 0 30px rgba(57,255,20,0.25),
        inset 0 0 60px rgba(0,0,0,0.8);
    }

    #message {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #00cc00;
      text-shadow: 0 0 4px #00cc00;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h1>PONG</h1>
  <div id="scoreboard">
    <span>PLAYER &nbsp;<span id="playerScore">0</span></span>
    <span><span id="cpuScore">0</span>&nbsp; CPU</span>
  </div>

  <div id="bezel">
    <canvas id="pong" width="800" height="500"></canvas>
  </div>

  <p id="message">Press <strong>Space</strong> or click the canvas to start</p>

  <script>
    const canvas = document.getElementById('pong');
    const ctx    = canvas.getContext('2d');

    const W           = canvas.width;
    const H           = canvas.height;
    const PADDLE_W    = 14;
    const PADDLE_H    = 90;
    const BALL_SIZE   = 12;
    const PADDLE_SPEED = 5;
    const CPU_SPEED   = 4;
    const WIN_SCORE   = 7;

    // ── Colours ──────────────────────────────────────────────────────────────
    const C = {
      bg:          '#000d00',
      surface:     '#001400',       // felt-like dark green table surface
      line:        'rgba(57,255,20,0.12)',
      lineCenter:  'rgba(57,255,20,0.18)',
      paddle:      '#39ff14',
      paddleGlow:  '#39ff14',
      ball:        '#ccff66',
      ballGlow:    '#39ff14',
      net:         'rgba(57,255,20,0.30)',
      courtLine:   'rgba(57,255,20,0.20)',
    };

    let playerScore = 0;
    let cpuScore    = 0;
    let running     = false;
    let gameOver    = false;

    const player = { x: 28, y: H / 2 - PADDLE_H / 2 };
    const cpu    = { x: W - 28 - PADDLE_W, y: H / 2 - PADDLE_H / 2 };
    const ball   = { x: W / 2, y: H / 2, dx: 5, dy: 3, speed: 5 };

    const keys = {};
    document.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') startOrRestart();
    });
    document.addEventListener('keyup', e => { keys[e.code] = false; });
    canvas.addEventListener('click', startOrRestart);

    // ── Game control ─────────────────────────────────────────────────────────
    function startOrRestart() {
      if (gameOver) {
        playerScore = 0; cpuScore = 0;
        document.getElementById('playerScore').textContent = 0;
        document.getElementById('cpuScore').textContent    = 0;
        gameOver = false;
        document.getElementById('message').textContent = '';
      }
      if (!running) {
        resetBall();
        running = true;
        document.getElementById('message').textContent = '';
        requestAnimationFrame(loop);
      }
    }

    function resetBall() {
      ball.x = W / 2; ball.y = H / 2;
      ball.speed = 5;
      const angle = (Math.random() * 60 - 30) * Math.PI / 180;
      const dir   = Math.random() > 0.5 ? 1 : -1;
      ball.dx = dir * ball.speed * Math.cos(angle);
      ball.dy = ball.speed * Math.sin(angle);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    function update() {
      if (keys['ArrowUp']   || keys['KeyW']) player.y -= PADDLE_SPEED;
      if (keys['ArrowDown'] || keys['KeyS']) player.y += PADDLE_SPEED;
      player.y = Math.max(0, Math.min(H - PADDLE_H, player.y));

      const cpuCenter = cpu.y + PADDLE_H / 2;
      if (cpuCenter < ball.y - 10) cpu.y += CPU_SPEED;
      else if (cpuCenter > ball.y + 10) cpu.y -= CPU_SPEED;
      cpu.y = Math.max(0, Math.min(H - PADDLE_H, cpu.y));

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.y <= 0)              { ball.y = 0;              ball.dy *= -1; }
      if (ball.y + BALL_SIZE >= H)  { ball.y = H - BALL_SIZE;  ball.dy *= -1; }

      // Player paddle hit
      if (
        ball.x <= player.x + PADDLE_W && ball.x >= player.x &&
        ball.y + BALL_SIZE >= player.y && ball.y <= player.y + PADDLE_H
      ) {
        ball.x = player.x + PADDLE_W;
        const hit   = (ball.y + BALL_SIZE / 2 - player.y) / PADDLE_H;
        const angle = (hit - 0.5) * (Math.PI / 2.5);
        ball.speed  = Math.min(ball.speed + 0.3, 14);
        ball.dx =  ball.speed * Math.cos(angle);
        ball.dy =  ball.speed * Math.sin(angle);
      }

      // CPU paddle hit
      if (
        ball.x + BALL_SIZE >= cpu.x && ball.x + BALL_SIZE <= cpu.x + PADDLE_W &&
        ball.y + BALL_SIZE >= cpu.y  && ball.y <= cpu.y + PADDLE_H
      ) {
        ball.x = cpu.x - BALL_SIZE;
        const hit   = (ball.y + BALL_SIZE / 2 - cpu.y) / PADDLE_H;
        const angle = (hit - 0.5) * (Math.PI / 2.5);
        ball.speed  = Math.min(ball.speed + 0.3, 14);
        ball.dx = -ball.speed * Math.cos(angle);
        ball.dy =  ball.speed * Math.sin(angle);
      }

      if (ball.x < 0) {
        cpuScore++;
        document.getElementById('cpuScore').textContent = cpuScore;
        checkWin(); resetBall();
      }
      if (ball.x > W) {
        playerScore++;
        document.getElementById('playerScore').textContent = playerScore;
        checkWin(); resetBall();
      }
    }

    function checkWin() {
      if (playerScore >= WIN_SCORE || cpuScore >= WIN_SCORE) {
        running = false; gameOver = true;
        const winner = playerScore >= WIN_SCORE ? 'PLAYER WINS' : 'CPU WINS';
        document.getElementById('message').textContent =
          `${winner} — Press Space or click to play again`;
      }
    }

    // ── Draw ──────────────────────────────────────────────────────────────────
    function draw() {
      // ── Table surface ──
      ctx.fillStyle = C.surface;
      ctx.fillRect(0, 0, W, H);

      // Subtle radial vignette to simulate table depth
      const vignette = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);

      // ── Court boundary lines ──
      ctx.strokeStyle = C.courtLine;
      ctx.lineWidth   = 2;
      ctx.strokeRect(10, 10, W - 20, H - 20);

      // Corner arcs
      const r = 18;
      ctx.beginPath();
      [[10+r, 10+r], [W-10-r, 10+r], [W-10-r, H-10-r], [10+r, H-10-r]].forEach(([cx, cy], i) => {
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, [Math.PI, Math.PI*1.5, 0, Math.PI*0.5][i],
                            [Math.PI*1.5, 0, Math.PI*0.5, Math.PI][i]);
      });
      ctx.strokeStyle = C.courtLine;
      ctx.stroke();

      // ── Centre circle ──
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2);
      ctx.strokeStyle = C.courtLine;
      ctx.lineWidth   = 1.5;
      ctx.stroke();

      // ── Net (dashed centre line) ──
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = C.net;
      ctx.lineWidth   = 3;
      ctx.beginPath();
      ctx.moveTo(W / 2, 10);
      ctx.lineTo(W / 2, H - 10);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Paddle — rounded rect with glow ──
      function drawPaddle(x, y) {
        const radius = 5;
        ctx.shadowColor = C.paddleGlow;
        ctx.shadowBlur  = 14;
        ctx.fillStyle   = C.paddle;
        ctx.beginPath();
        ctx.roundRect(x, y, PADDLE_W, PADDLE_H, radius);
        ctx.fill();

        // Highlight stripe down the centre
        ctx.shadowBlur = 0;
        const grad = ctx.createLinearGradient(x, y, x + PADDLE_W, y);
        grad.addColorStop(0,   'rgba(255,255,255,0)');
        grad.addColorStop(0.4, 'rgba(255,255,255,0.18)');
        grad.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x, y, PADDLE_W, PADDLE_H, radius);
        ctx.fill();
      }

      drawPaddle(player.x, player.y);
      drawPaddle(cpu.x,    cpu.y);

      // ── Ball — circle with glow trail ──
      ctx.shadowColor = C.ballGlow;
      ctx.shadowBlur  = 20;
      ctx.fillStyle   = C.ball;
      ctx.beginPath();
      ctx.arc(ball.x + BALL_SIZE / 2, ball.y + BALL_SIZE / 2, BALL_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();

      // Inner bright spot
      ctx.shadowBlur = 0;
      ctx.fillStyle  = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(
        ball.x + BALL_SIZE / 2 - 2,
        ball.y + BALL_SIZE / 2 - 2,
        BALL_SIZE / 5, 0, Math.PI * 2
      );
      ctx.fill();

      ctx.shadowBlur = 0;
    }

    function loop() {
      if (!running) return;
      update();
      draw();
      requestAnimationFrame(loop);
    }

    draw(); // initial static frame
  </script>
</body>
</html>
