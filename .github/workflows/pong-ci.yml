name: Pong App — Build & Publish

on:
  push:
    branches: [main]
    paths:
      - "pong-app/**"
      - ".github/workflows/pong-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "pong-app/**"
      - ".github/workflows/pong-ci.yml"
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: pong-app          # change if your ECR repo has a different name
  IMAGE_NAME: pong-app

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Build the Docker image and export it as a GitHub artifact
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate a consistent tag: short SHA on push, PR number on PRs
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./pong-app
          file: ./pong-app/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Export the image as a tarball so we can upload it as an artifact
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ steps.meta.outputs.version }}
          path: /tmp/${{ env.IMAGE_NAME }}.tar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Push to ECR — only on pushes to main
  # ─────────────────────────────────────────────────────────────────────────────
  push-to-ecr:
    name: Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      id-token: write   # required for OIDC auth with AWS
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./pong-app
          file: ./pong-app/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output ECR image URI
        run: |
          echo "Image pushed to ECR:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
